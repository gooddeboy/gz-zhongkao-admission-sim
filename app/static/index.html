<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1f2ee">
  <title>简化广州中考公办高中录取模拟系统</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-text">
          <strong>中考录取模拟</strong>
          <span>广州公办高中 · 录取台账</span>
        </div>
      </div>
      <nav class="nav">
        <a class="nav-item" href="#/overview" data-route="overview">
          <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
          <span>概览</span>
        </a>
        <a class="nav-item" href="#/data" data-route="data">
          <svg viewBox="0 0 24 24"><path d="M3 5h18M3 12h18M3 19h18M9 5v14"/></svg>
          <span>数据管理</span>
        </a>
        <a class="nav-item" href="#/runs" data-route="runs">
          <svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>
          <span>投档执行</span>
        </a>
        <a class="nav-item" href="#/results" data-route="results">
          <svg viewBox="0 0 24 24"><path d="M10.5 4a6.5 6.5 0 100 13 6.5 6.5 0 000-13zM15.4 15.4L21 21"/></svg>
          <span>结果查询</span>
        </a>
        <a class="nav-item" href="#/stats" data-route="stats">
          <svg viewBox="0 0 24 24"><path d="M3 20h18M6 20v-6M11 20V7M16 20v-9"/></svg>
          <span>统计分析</span>
        </a>
        <a class="nav-item" href="#/cases" data-route="cases">
          <svg viewBox="0 0 24 24"><path d="M4 5h6v6H4zM14 13h6v6h-6zM10 8h3a2 2 0 012 2v3"/></svg>
          <span>滑档案例</span>
        </a>
        <a class="nav-item" href="#/help" data-route="help">
          <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zM9.6 9.2a2.5 2.5 0 014.9.8c0 1.5-2.4 1.7-2.4 3.2M12 17h.01"/></svg>
          <span>帮助与规则</span>
        </a>
      </nav>
      <div class="sidebar-foot">
        <div class="dot-line"><span class="dot ok"></span><span>本地 SQLite · 可离线运行</span></div>
        <a href="/docs" target="_blank" rel="noreferrer">REST API 文档</a>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="crumb" id="crumb">概览</div>
        <div class="top-actions">
          <span class="badge badge-muted" id="dataset-badge">数据加载中</span>
          <a class="btn btn-ghost btn-sm" href="/docs" target="_blank" rel="noreferrer">API</a>
        </div>
      </header>
      <main id="view" class="view">
        <div class="loading">正在加载系统数据…</div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <div id="overlay" class="overlay hidden"><div class="spinner"></div><div id="overlay-text">处理中…</div></div>

  <script src="/static/app.js"></script>
</body>
</html>
